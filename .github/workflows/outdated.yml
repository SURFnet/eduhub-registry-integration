name: Run outdated check

on: workflow_call

jobs:
  outdated:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: jomco/clojure-action@v0
      with: { m2-cache-key: m2-outdated }

    - name: Run make outdated
      run: |
        make outdated
