name: Run tests

on: workflow_call

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: jomco/clojure-action@4259a5767c4dac675217229f2facf927211ff76b # v1
      with: { m2-cache-key: m2-test }

    - name: run tests
      run: make check
