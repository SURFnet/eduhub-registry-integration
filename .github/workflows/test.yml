name: Run tests

on: workflow_call

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: jomco/clojure-action@v0
      with: { m2-cache-key: m2-test }

    - name: run tests
      run: make check
